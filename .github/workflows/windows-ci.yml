name: Windows CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Rebuild tested source package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src -Force | Out-Null
          $parts = Get-ChildItem .\source\chunk.*.b64 | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 source chunks, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('.\source\source.zip', [Convert]::FromBase64String($b64))
          tar -xf .\source\source.zip -C .\src
          if (-not (Test-Path .\src\ChatGPTUsageWidget.csproj)) { throw "Source package did not extract correctly." }

      - name: Restore
        working-directory: src
        run: dotnet restore ChatGPTUsageWidget.csproj

      - name: Build
        working-directory: src
        run: dotnet build ChatGPTUsageWidget.csproj -c Release --no-restore

      - name: Logic tests
        working-directory: src
        run: dotnet run --project tests/ChatGPTUsageWidget.Tests/ChatGPTUsageWidget.Tests.csproj -c Release

      - name: Publish self-contained EXE
        shell: pwsh
        working-directory: src
        run: |
          dotnet publish ChatGPTUsageWidget.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o publish `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            /p:DebugType=None `
            /p:DebugSymbols=false

      - name: WPF startup smoke test
        shell: pwsh
        working-directory: src
        run: |
          $p = Start-Process -FilePath ".\publish\ChatGPTUsageWidget.exe" -ArgumentList "--smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Write-Error "Smoke test failed with exit code $($p.ExitCode)"
            exit $p.ExitCode
          }

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item .\src\publish\ChatGPTUsageWidget.exe .\artifact\
          Copy-Item .\src\INSTALL_PREBUILT.cmd .\artifact\
          Copy-Item .\src\README_RU.md .\artifact\

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTUsageWidget-0.2.1-win-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
