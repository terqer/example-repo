name: Windows CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Rebuild source package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src -Force | Out-Null
          $parts = Get-ChildItem .\source\chunk.*.b64 | Sort-Object Name
          if ($parts.Count -ne 9) { throw "Expected 9 source chunks, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('.\source\source.zip', [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash .\source\source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'c8b63c127aa46ac1bfbe0d16c5eb5e2736e9e73678da5e0e6bc5321a30822c57') { throw "Source package hash mismatch: $sha" }
          tar -xf .\source\source.zip -C .\src
          if (-not (Test-Path .\src\ChatGPTUsageWidget.csproj)) { throw "Source package did not extract correctly." }

      - name: Restore
        working-directory: src
        run: dotnet restore ChatGPTUsageWidget.csproj

      - name: Build
        working-directory: src
        run: dotnet build ChatGPTUsageWidget.csproj -c Release --no-restore

      - name: Logic tests
        working-directory: src
        run: dotnet run --project tests/ChatGPTUsageWidget.Tests/ChatGPTUsageWidget.Tests.csproj -c Release

      - name: Publish self-contained EXE
        working-directory: src
        shell: pwsh
        run: |
          if (Test-Path .\dist) { Remove-Item .\dist -Recurse -Force }
          dotnet publish .\ChatGPTUsageWidget.csproj -c Release -r win-x64 --self-contained true -o .\dist /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true /p:DebugType=None /p:DebugSymbols=false
          if (-not (Test-Path .\dist\ChatGPTUsageWidget.exe)) { throw 'Published EXE not found.' }

      - name: WPF startup and render smoke test
        working-directory: src
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\ChatGPTUsageWidget.exe' -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Smoke test failed with exit code $($process.ExitCode)" }

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifact -Force | Out-Null
          Copy-Item .\src\dist\ChatGPTUsageWidget.exe .\artifact\ChatGPTUsageWidget.exe
          Copy-Item .\src\INSTALL_PREBUILT.cmd .\artifact\INSTALL_PREBUILT.cmd
          Copy-Item .\src\README_RU.md .\artifact\README_RU.md

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTUsageWidget-0.4.0-win-x64
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
