name: Windows CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Rebuild 0.5.0 source package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path src050 -Force | Out-Null
          $partNames = @('part.00','part.01','part.02.00','part.02.01','part.02.02','part.02.03','part.03','part.04')
          $missing = $partNames | Where-Object { -not (Test-Path (Join-Path '.\source050' $_)) }
          if ($missing) { throw "Missing source parts: $($missing -join ', ')" }
          $b64 = ($partNames | ForEach-Object { Get-Content (Join-Path '.\source050' $_) -Raw }) -join ''
          [IO.File]::WriteAllBytes('.\source050\source.zip', [Convert]::FromBase64String($b64))
          $sha = (Get-FileHash .\source050\source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '66185086ab011cf519264edcd2ef333674b843152e70d593476219a51bdcefa2') { throw "Source package hash mismatch: $sha" }
          tar -xf .\source050\source.zip -C .\src050
          if (-not (Test-Path .\src050\ChatGPTUsageWidget.csproj)) { throw 'Source package did not extract correctly.' }

      - name: Recreate verified 0.5.0 compile baseline
        shell: pwsh
        run: |
          @'
          global using Application = System.Windows.Application;
          global using Point = System.Windows.Point;
          global using Size = System.Windows.Size;
          global using Brush = System.Windows.Media.Brush;
          global using Pen = System.Windows.Media.Pen;
          global using Color = System.Windows.Media.Color;
          global using ColorConverter = System.Windows.Media.ColorConverter;
          global using FontFamily = System.Windows.Media.FontFamily;
          global using MessageBox = System.Windows.MessageBox;
          global using MouseEventArgs = System.Windows.Input.MouseEventArgs;
          global using Cursors = System.Windows.Input.Cursors;
          global using Button = System.Windows.Controls.Button;
          global using Condition = System.Windows.Automation.Condition;
          global using WpfFlowDirection = System.Windows.FlowDirection;
          global using Directory = System.IO.Directory;
          global using Path = System.IO.Path;
          global using File = System.IO.File;
          '@ | Set-Content .\src050\GlobalAliases.cs -Encoding UTF8
          $proj = Get-Content .\src050\ChatGPTUsageWidget.csproj -Raw
          $proj = $proj -replace '(?s)\s*<ItemGroup>\s*<Reference Include="UIAutomationClient"\s*/>\s*<Reference Include="UIAutomationTypes"\s*/>\s*</ItemGroup>', ''
          Set-Content .\src050\ChatGPTUsageWidget.csproj $proj -Encoding UTF8
          $widget = Get-Content .\src050\WidgetWindow.xaml.cs -Raw
          $widget = $widget.Replace('var left = p.X <= edge, right = p.X >= ActualWidth - edge, top = p.Y <= edge, bottom = p.Y >= ActualHeight - edge;', 'bool left = p.X <= edge, right = p.X >= ActualWidth - edge, top = p.Y <= edge, bottom = p.Y >= ActualHeight - edge;')
          Set-Content .\src050\WidgetWindow.xaml.cs $widget -Encoding UTF8
          $surface = Get-Content .\src050\Controls\UsageSurface.cs -Raw
          $surface = $surface.Replace('FlowDirection.LeftToRight', 'WpfFlowDirection.LeftToRight')
          Set-Content .\src050\Controls\UsageSurface.cs $surface -Encoding UTF8

      - name: Apply 0.5.1 redesign patch
        shell: pwsh
        run: |
          @'
          import base64, gzip, hashlib, pathlib
          root = pathlib.Path('patch051')
          names = ['chunk.00','chunk.01a','chunk.01b0','chunk.01b1','chunk.01b2','chunk.02','chunk.03','chunk.04','chunk.05']
          parts = []
          for name in names:
              text = (root / name).read_text(encoding='utf-8')
              if name == 'chunk.01b2':
                  text = text.replace(' ' + 'n', chr(78))
              parts.append(''.join(text.split()))
          data = gzip.decompress(base64.b64decode(''.join(parts), validate=True))
          target = '230572315ade3f015fd835097bfae065dd8bccf8cba0f81ca1be4c7c671d8efe'
          actual = hashlib.sha256(data).hexdigest()
          if actual != target:
              raise SystemExit(f'Patch hash mismatch: {actual}')
          pathlib.Path('v051.patch').write_bytes(data)
          print('Verified patch SHA256:', actual)
          '@ | python -
          if (-not (Test-Path .\v051.patch)) { throw 'Verified patch was not created.' }
          git -C .\src050 init
          git -C .\src050 apply ..\v051.patch
          if ($LASTEXITCODE -ne 0) { throw 'git apply failed.' }
          if (-not ((Get-Content .\src050\ChatGPTUsageWidget.csproj -Raw) -match '<Version>0\.5\.1</Version>')) { throw '0.5.1 patch did not apply.' }
          $tests = Get-Content .\src050\tests\ChatGPTUsageWidget.Tests\Program.cs -Raw
          $tests = $tests.Replace('settings.SchemaVersion == 5', 'settings.SchemaVersion == 6')
          $tests = $tests.Replace('Width == 48 && settings.Widgets[0].Height == 22', 'Width == 44 && settings.Widgets[0].Height == 22')
          $tests = $tests.Replace('Taskbar.Width == 48 && settings.Taskbar.Height == 22', 'Taskbar.Width == 44 && settings.Taskbar.Height == 22')
          Set-Content .\src050\tests\ChatGPTUsageWidget.Tests\Program.cs $tests -Encoding UTF8

      - name: Restore
        working-directory: src050
        run: dotnet restore ChatGPTUsageWidget.csproj

      - name: Build
        working-directory: src050
        run: dotnet build ChatGPTUsageWidget.csproj -c Release --no-restore

      - name: Logic tests
        working-directory: src050
        run: dotnet run --project tests/ChatGPTUsageWidget.Tests/ChatGPTUsageWidget.Tests.csproj -c Release -r win-x64 -p:SelfContained=true

      - name: Publish self-contained EXE
        working-directory: src050
        shell: pwsh
        run: |
          if (Test-Path .\dist) { Remove-Item .\dist -Recurse -Force }
          dotnet publish .\ChatGPTUsageWidget.csproj -c Release -r win-x64 --self-contained true -o .\dist /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true /p:DebugType=None /p:DebugSymbols=false
          if (-not (Test-Path .\dist\ChatGPTUsageWidget.exe)) { throw 'Published EXE not found.' }

      - name: WPF render and startup smoke test
        working-directory: src050
        shell: pwsh
        run: |
          $preview = Join-Path (Get-Location) 'preview'
          New-Item -ItemType Directory -Path $preview -Force | Out-Null
          $env:CHATGPT_WIDGET_PREVIEW_DIR = $preview
          $p = Start-Process -FilePath '.\dist\ChatGPTUsageWidget.exe' -ArgumentList '--smoke-test' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
          $images = @(Get-ChildItem .\preview -Filter *.png)
          if ($images.Count -lt 12) { throw "Expected at least 12 UI preview images, found $($images.Count)." }

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\artifact -Force | Out-Null
          Copy-Item .\src050\dist\ChatGPTUsageWidget.exe .\artifact\ChatGPTUsageWidget.exe
          Copy-Item .\src050\INSTALL_PREBUILT.cmd .\artifact\INSTALL_PREBUILT.cmd
          Copy-Item .\src050\README_RU.md .\artifact\README_RU.md

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTUsageWidget-0.5.1-win-x64
          path: artifact/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTUsageWidget-0.5.1-ui-previews
          path: src050/preview/*.png
          if-no-files-found: error
          retention-days: 7
